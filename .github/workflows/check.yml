name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install.sh собран из актуальных исходников
        run: python3 tools/build.py --check
      - name: синтаксис
        run: |
          bash -n install.sh
          sh -n exit/entrypoint.sh
          python3 -m py_compile bot/bot.py tools/build.py
      - name: shellcheck
        run: shellcheck -S error install.sh exit/entrypoint.sh
